name: Build Salad LTX Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/youtube-studio-salad-ltx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1
          test -f Dockerfile

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx version
          docker buildx create --name salad-builder --use || docker buildx use salad-builder
          docker buildx inspect --bootstrap
          docker buildx build             --platform linux/amd64             --push             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.description=Salad runtime image for YouTube Studio LTX probes. No model weights."             -t "${IMAGE_NAME}:cu124-v1"             -t "${IMAGE_NAME}:latest"             .
